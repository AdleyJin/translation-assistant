<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Translator Settings</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="ait-options">
    <main class="ait-options-panel">
      <button id="closeOptions" class="ait-close-button" type="button" aria-label="关闭设置">x</button>
      <h1>AI Translator 设置</h1>

      <label class="ait-field">
        <span>模型供应商</span>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen-cn">通义千问 中国站</option>
          <option value="qwen-intl">通义千问 国际站</option>
          <option value="custom">自定义 OpenAI-compatible</option>
        </select>
      </label>

      <label class="ait-field">
        <span>API Key</span>
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
      </label>

      <label class="ait-field">
        <span>Base URL</span>
        <input id="baseUrl" type="url" placeholder="https://api.openai.com">
      </label>

      <label class="ait-field">
        <span>Model</span>
        <input id="model" type="text" list="modelPresets" placeholder="gpt-4o-mini">
        <datalist id="modelPresets"></datalist>
      </label>

      <label class="ait-field">
        <span>默认目标语言</span>
        <input id="targetLanguage" type="text" placeholder="中文">
      </label>

      <label class="ait-field">
        <span>并发段落数</span>
        <input id="maxConcurrent" type="number" min="1" max="4" step="1">
      </label>

      <button id="save" type="button">保存设置</button>
      <div id="status" class="ait-status" role="status"></div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
